version: "3.9"

services:
  secretd:
    build: .
    ports:
      - "8200:8200"
    environment:
      DATABASE_URL: postgres://secretd:secretd@postgres:5432/secretd
      SECRETD_LISTEN: "0.0.0.0:8200"
      SECRETD_DEV_ROOT_TOKEN: "dev-root-token"
      # Generate with: openssl rand -base64 32
      SECRETD_KEK_ID: "00000000-0000-0000-0000-000000000001"
      SECRETD_KEK: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      SECRETD_JWT_SECRET: "change-me-in-production"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secretd
      POSTGRES_PASSWORD: secretd
      POSTGRES_DB: secretd
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretd"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: Redis cache layer
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
