[workspace]
members = [
    "crates/server",
    "crates/cli",
    "crates/secretd-core",
    "crates/auth",
    "crates/db",
    "crates/api-vault",
    "crates/api-aws",
    "crates/api-gcp",
    "crates/api-azure",
    "crates/api-cloudflare",
    "crates/api-bitwarden",
    "crates/api-native",
    "crates/sync",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Carter Cole"]
repository = "https://github.com/cartercole/opensourcepasswordmanager"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }
hyper = { version = "1" }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "sqlite", "uuid", "chrono", "json", "migrate"] }

# Redis
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography
aes-gcm = "0.10"
ring = "0.17"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"

# JWT
jsonwebtoken = "9"

# WebAuthn / Passkeys
webauthn-rs = { version = "0.5" }

# Force vendored OpenSSL so no system headers needed
openssl = { version = "0.10", features = ["vendored"] }

# TOTP
totp-rs = { version = "5", features = ["qr"] }

# UUID + time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Config
config = "0.14"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Async traits
async-trait = "0.1"

# Include static files in binary
include_dir = "0.7"

# HTTP client (for sync engine)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# URL parsing
url = "2"
