[package]
name = "opensourcepasswordmanager"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Carter Cole"]
repository = "https://github.com/cartercole/opensourcepasswordmanager"

[lib]
name = "opensourcepasswordmanager"
path = "src/lib.rs"

[[bin]]
name = "secretd"
path = "src/main.rs"

[[bin]]
name = "secretd-cli"
path = "src/bin/cli.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "sqlite", "uuid", "chrono", "json", "migrate"] }

# Redis
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"

# JWT
jsonwebtoken = "9"

# WebAuthn / Passkeys
webauthn-rs = { version = "0.5" }
openssl = { version = "0.10", features = ["vendored"] }

# TOTP
totp-rs = { version = "5", features = ["qr"] }

# UUID + time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Async traits
async-trait = "0.1"

# Include static assets in binary
include_dir = "0.7"

# MIME type detection (for serving the UI)
mime_guess = "2"

# HTTP client (sync engine)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }

[features]
embed-ui = []
